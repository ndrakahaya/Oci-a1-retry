name: OCI ARM Retry

on:
  workflow_dispatch:  # Manual trigger only

concurrency:
  group: oci-retry            # Only one Job allowed per group
  cancel-in-progress: false   # Do not cancel running jobs; new ones queue (max 1 running + 1 waiting)

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 50       # UPST (OIDC session token) lasts ~60 min; keep the run well inside it
    permissions:
      id-token: write         # Required for GitHub OIDC JWT
      contents: read
      actions: write          # Finish step: built-in-token fallback for dispatching the next job / disabling the workflow
      issues: write           # Finish step: "instance ready" notification issue
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Suppress Node.js 20 deprecation warning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: pip install oci==2.190.0   # the version this code was verified against (diagnose.yml pins it too)

      - name: Exchange GitHub OIDC token for OCI session token (manual, transparent)
        # Manual exchange (oidc_exchange.sh) replaces the gtrevorrow action black box:
        # it prints the decoded JWT claims so a Trust-rule mismatch is diagnosable.
        env:
          OIDC_CLIENT_IDENTIFIER: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          DOMAIN_BASE_URL: ${{ vars.DOMAIN_BASE_URL }}
          OCI_TENANCY: ${{ vars.OCI_TENANCY }}
          OCI_REGION: ap-singapore-1
          OCI_USER: ocid1.user.oc1..aaaaaaaaavidw4nyv67rdxq4qdbrc7t7nbhpthhdnrkc5gkyggcyf6uukata
        run: bash oidc_exchange.sh

      - name: Verify OCI auth (fail fast if exchange did not work)
        env:
          OCI_USER: ocid1.user.oc1..aaaaaaaaavidw4nyv67rdxq4qdbrc7t7nbhpthhdnrkc5gkyggcyf6uukata
        run: |
          python3 <<'PYEOF'
          import oci, os
          from oci.auth.signers import SecurityTokenSigner
          from oci.signer import load_private_key
          c = oci.config.from_file()
          # Explicit SecurityTokenSigner: the SDK does NOT detect
          # security_token_file from the config (2.190.0) — without this, the
          # client falls back to a plain API-key Signer and the UPST is never
          # attached -> 401 NotAuthenticated (runs #238, #288).
          # NOTE: SecurityTokenSigner needs a LOADED key object, not a PEM
          # string — raw string raises AttributeError 'str' has no
          # attribute 'public_key' (run #289).
          token = open(c['security_token_file']).read().strip()
          key = load_private_key(open(c['key_file']).read(), None)
          signer = SecurityTokenSigner(token, key)
          u = oci.identity.IdentityClient(c, signer=signer)
          me = u.get_user(os.environ['OCI_USER']).data
          print('API_OK user=' + me.name)
          # Tenancy OCID straight from Oracle (a user's compartment_id IS the tenancy).
          # Typed/pasted OCIDs (vars.OCI_TENANCY, hardcoded) are NOT trusted: the hardcoded
          # one had 61 unique chars (valid = 60) -> likely cause of the run #290 404.
          tenancy = me.compartment_id
          print('TENANCY_CHECK oracle_len=%d config_len=%d config_same_as_oracle=%s'
                % (len(tenancy), len(c['tenancy']), c['tenancy'] == tenancy))
          # DIAGNOSTIC (non-fatal): list the service user's groups. It must not block the
          # retry step: the legacy IAM API may not list domain users/groups at all.
          user_id = os.environ['OCI_USER']
          try:
              memberships = u.list_user_group_memberships(tenancy, user_id=user_id).data
              print(f'DIAG groups for user: {len(memberships)} membership(s)')
              for m in memberships:
                  g = u.get_group(m.group_id).data
                  print(f'DIAG group: {g.name} ({g.id})')
          except oci.exceptions.ServiceError as e:
              print(f'DIAG groups unavailable: {e.status} {e.code} (non-fatal)')
          PYEOF
          # NOTE: config user is a dummy OCID (the UPST identifies the user),
          # so get_user must use the OCI_USER env var, not c['user']. No pipe to tail:
          # a pipe would mask the failure (exit code becomes 0).

      - name: Run OCI retry script
        # timeout 2700s = 45 min; UPST lasts ~60 min, so the token stays valid for the whole run
        # Exit codes: 0 = instance created (auto-disable) | 124 = 45-min timeout, still
        # out of capacity (relay to next Job) | anything else = fast failure, e.g. auth
        # error (do NOT relay — a tight loop of failing runs helps nobody; fix and re-run).
        # The step always exits 0 so SCRIPT_EXIT can be read; the Finish step below turns
        # anything other than 0 / 124 into a red job (failure e-mail) and relays only on 124.
        # 124 also covers "session token expired mid-run" (the script exits 124 itself).
        id: run_script
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER: ocid1.user.oc1..aaaaaaaaavidw4nyv67rdxq4qdbrc7t7nbhpthhdnrkc5gkyggcyf6uukata  # read by resolve_tenancy()
        run: |
          set +e
          timeout 2700 python oci_retry.py
          echo "SCRIPT_EXIT=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Finish (disable on success | relay on timeout | fail loudly otherwise)
        # One step decides everything from SCRIPT_EXIT. What changed from the old three steps:
        #  - every GitHub API call is now checked. curl -s used to swallow a 401 from an expired
        #    GH_PAT and still print "Next Job triggered", so the chain died without a sound;
        #  - GH_PAT is tried first, then the built-in token (job permission actions: write),
        #    so an expired PAT alone can no longer break the relay;
        #  - a fast failure (exit 1 / 2 / ...) now turns the job red. Before, the script step
        #    always exited 0, the job stayed green and no failure e-mail was ever sent;
        #  - on success an issue @-mentioning the owner is opened (best effort), because GitHub
        #    sends no e-mail for a green run.
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BUILTIN_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          api() {  # api METHOD PATH [gh api args...]: PAT first, then built-in token; 3 rounds
            local round tok
            for round in 1 2 3; do
              for tok in "$GH_PAT" "$BUILTIN_TOKEN"; do
                [ -n "$tok" ] || continue
                if GH_TOKEN="$tok" gh api --method "$1" "repos/$REPO/$2" "${@:3}" > /dev/null; then
                  return 0
                fi
              done
              sleep 10
            done
            return 1
          }
          case "${SCRIPT_EXIT:-unknown}" in
            0)
              GH_TOKEN="$BUILTIN_TOKEN" gh issue create --repo "$REPO" \
                --title "A1 instance ready (run #$GITHUB_RUN_NUMBER)" \
                --body "@${GITHUB_REPOSITORY_OWNER} the retry loop is done: the A1 instance exists. Public IP and SSH command are in the log of $RUN_URL (step: Run OCI retry script) and in the Oracle Cloud Console. If it came up as 1 OCPU / 6 GB, run the OCI A1 Resize workflow (tick confirm_reboot) to raise it to 2 OCPU / 12 GB. This workflow is being disabled now." \
                || echo "::warning::could not open the notification issue"
              if api PUT actions/workflows/oci_retry.yml/disable; then
                echo "Workflow auto-disabled"
              else
                echo "::error::instance exists but the workflow could NOT be disabled: disable it by hand"
                exit 1
              fi
              ;;
            124)
              if api POST actions/workflows/oci_retry.yml/dispatches -f ref="$REF"; then
                echo "Next job triggered"
              else
                echo "::error::relay failed with both tokens: the chain stops here, run the workflow again by hand"
                exit 1
              fi
              ;;
            *)
              echo "::error::oci_retry.py exited with ${SCRIPT_EXIT:-unknown} (2 = config / auth / permission / quota, 1 = setup kept failing): not relaying. Read the log above, fix, then run the workflow again."
              exit 1
              ;;
          esac
