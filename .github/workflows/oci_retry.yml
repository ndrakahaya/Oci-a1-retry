name: OCI ARM Retry

on:
  workflow_dispatch:  # Manual trigger only

concurrency:
  group: oci-retry            # Only one Job allowed per group
  cancel-in-progress: false   # Do not cancel running jobs; new ones queue (max 1 running + 1 waiting)

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 50       # UPST (OIDC session token) lasts ~60 min; keep the run well inside it
    permissions:
      id-token: write         # Required for GitHub OIDC JWT
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Suppress Node.js 20 deprecation warning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: pip install oci

      - name: Exchange GitHub OIDC token for OCI session token (manual, transparent)
        # Manual exchange (oidc_exchange.sh) replaces the gtrevorrow action black box:
        # it prints the decoded JWT claims so a Trust-rule mismatch is diagnosable.
        env:
          OIDC_CLIENT_IDENTIFIER: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          DOMAIN_BASE_URL: ${{ vars.DOMAIN_BASE_URL }}
          OCI_TENANCY: ${{ vars.OCI_TENANCY }}
          OCI_REGION: ap-singapore-1
          OCI_USER: ocid1.user.oc1..aaaaaaaaavidw4nyv67rdxq4qdbrc7t7nbhpthhdnrkc5gkyggcyf6uukata
        run: bash oidc_exchange.sh

      - name: Verify OCI auth (fail fast if exchange did not work)
        run: |
          python3 -c "import oci; c=oci.config.from_file(); u=oci.identity.IdentityClient(c); print('API_OK user='+u.get_user(c['user']).data.name)" 2>&1 | tail -3

      - name: Run OCI retry script
        # Script succeeds (exit 0)  → next step auto-disables the workflow
        # Timeout expires (exit 124) → treated as failure, triggers next Job
        # timeout 2700s = 45 min; UPST lasts ~60 min, so the token stays valid for the whole run
        id: run_script
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: timeout 2700 python oci_retry.py

      - name: Auto-disable workflow on success
        if: steps.run_script.outcome == 'success'
        run: |
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/oci_retry.yml/disable
          echo "Workflow auto-disabled"

      - name: Trigger next Job (seamless relay)
        if: steps.run_script.outcome != 'success'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/oci_retry.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Next Job triggered"
