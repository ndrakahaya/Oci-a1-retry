name: OCI Retry Watchdog

# OPTIONAL safety net for the relay chain in oci_retry.yml.
# Every 30 minutes: if oci_retry.yml is enabled but nothing is queued or running (the chain
# died: expired GH_PAT, a GitHub hiccup, ...), start it again. It does nothing when
#   - oci_retry.yml is disabled (it disables itself once the instance exists), or
#   - a run is already queued or in progress, or
#   - the last 3 finished runs all failed (circuit breaker: a config problem needs a human,
#     otherwise this would re-dispatch a failing run forever).
# To stop the whole thing on purpose, disable oci_retry.yml (or this workflow).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: ${{ github.ref_name }}
    steps:
      - name: Restart the chain if it died
        run: |
          state=$(gh api "repos/$REPO/actions/workflows/oci_retry.yml" --jq .state)
          if [ "$state" != "active" ]; then
            echo "oci_retry.yml is $state: nothing to do"
            exit 0
          fi
          runs=$(gh api "repos/$REPO/actions/workflows/oci_retry.yml/runs?per_page=30")
          live=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<< "$runs")
          if [ "$live" -gt 0 ]; then
            echo "$live run(s) queued or in progress: the chain is alive"
            exit 0
          fi
          bad=$(jq '[.workflow_runs[] | select(.status == "completed") | .conclusion] | .[0:3] | map(select(. == "failure" or . == "timed_out")) | length' <<< "$runs")
          if [ "$bad" -ge 3 ]; then
            echo "::warning::the last 3 runs all failed: not restarting. Fix the cause, then run oci_retry.yml by hand."
            exit 0
          fi
          gh api --method POST "repos/$REPO/actions/workflows/oci_retry.yml/dispatches" -f ref="$REF"
          echo "::warning::the chain was dead: oci_retry.yml dispatched again"
